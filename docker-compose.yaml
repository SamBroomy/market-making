services:
  sc:
    image: infinyon/fluvio:stable
    container_name: sc
    hostname: sc
    networks:
      - fluvio
    ports:
      - "9103:9003"
    environment:
      - RUST_LOG=info
    command: "./fluvio-run sc --local /fluvio/metadata"
    volumes:
      - fluvio-metadata:/fluvio/metadata
    healthcheck:
      test: ["CMD", "nc", "-z", "0.0.0.0", "9003"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 1s

  sc-setup:
    build:
      context: .
      dockerfile: Dockerfile.sc-setup
    container_name: sc-setup
    networks:
      - fluvio
    environment:
      - RUST_LOG=info
    depends_on:
      sc:
        condition: service_healthy

      # fluvio profile add docker sc:9003 docker;
      # fluvio cluster spu register --id 5001 -p 0.0.0.0:9110 --private-server spu:9011;
      # fluvio cluster spu register --id 5001 -p spu:9010 --private-server spu:9011;
      # Unsure if -l does anything here.
      # fluvio cluster check;
      # fluvio cluster status;
      # exit 0;
  spu:
    image: infinyon/fluvio:stable
    container_name: spu
    hostname: spu
    networks:
      - fluvio
    volumes:
      - fluvio-data:/fluvio/data
    environment:
      - RUST_LOG=info
    ports:
      - "9110:9010"
      - "9111:9011"
    command: "./fluvio-run spu -i 5001 -p spu:9010 -v spu:9011 --sc-addr sc:9004 --log-base-dir /fluvio/data"
    depends_on:
      sc-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "spu", "9010"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 1s


  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: market-making-producer
    networks:
      - fluvio
    depends_on:
      sc:
        condition: service_healthy
      spu:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - SYMBOL=ETHUSDT
    restart: unless-stopped
    volumes:
      - $HOME/.fluvio/config:/usr/.fluvio/config:ro


volumes:
  fluvio-metadata:
  fluvio-data:

networks:
  fluvio: