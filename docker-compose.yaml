services:
  iggy:
    image: apache/iggy:latest
    container_name: iggy
    restart: unless-stopped
    environment:
      - IGGY_ROOT_USERNAME=${IGGY_USERNAME:-iggy}
      - IGGY_ROOT_PASSWORD=${IGGY_PASSWORD:-Secret123!}
      - IGGY_HTTP_ENABLED=true
      - IGGY_HTTP_ADDRESS=0.0.0.0:80
      - IGGY_TCP_ENABLED=true
      - IGGY_TCP_ADDRESS=0.0.0.0:3000
      - IGGY_QUIC_ENABLED=false
      - IGGY_HEARTBEAT_ENABLED=true
      - IGGY_HEARTBEAT_INTERVAL=5s
    ports:
      - "3010:80"
      - "${IGGY_PORT:-5100}:3000"
    networks:
      - iggy-network
    volumes:
      - iggy:/iggy/local_data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 0.0.0.0 3000 && nc -z 0.0.0.0 80"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 3

  iggy-web-ui:
    image: iggyrs/iggy-web-ui:latest
    container_name: iggy-web-ui
    restart: unless-stopped
    environment:
      - PUBLIC_IGGY_API_URL=http://iggy:80
    ports:
      - "3050:3050"
    networks:
      - iggy-network
    depends_on:
      iggy:
        condition: service_healthy



  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb
    networks:
      - timescale-network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-market_data}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-market_data}"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   networks:
  #     - timescale-network
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
  #     - POSTGRES_HOST=timescaledb
  #     - POSTGRES_USER=${POSTGRES_USER:-postgres}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
  #     - POSTGRES_DB=${POSTGRES_DB:-market_data}
  #     - PGADMIN_CONFIG_SERVER_MODE=False
  #     - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   depends_on:
  #     timescaledb:
  #       condition: service_healthy
  #   user: root
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    networks:
      - iggy-network
      - timescale-network
    ports:
      - '3000:3000'
    environment:
      # Grafana configuration
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource

      # Database configuration for provisioning
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-market_data}

      # Enable provisioning
      - GF_PROVISIONING_ENABLE=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      timescaledb:
        condition: service_healthy




  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: market-making-producer
    networks:
      - iggy-network
      - timescale-network
    depends_on:
      timescaledb:
        condition: service_healthy
      iggy:
        condition: service_healthy
    environment:
      # Environment detection for YAML config selection
      - MARKET_ENVIRONMENT=${MARKET_ENVIRONMENT:-production}

      # Infrastructure configuration (shared with other services)
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-market_data}
      - POSTGRES_PORT=5432

      - IGGY_USERNAME=${IGGY_USERNAME:-iggy}
      - IGGY_PASSWORD=${IGGY_PASSWORD:-Secret123!}
      - IGGY_PORT=3000

    restart: unless-stopped


networks:
  iggy-network:
  timescale-network:

volumes:
  iggy:
  timescale-data:
  pgadmin-data:
  grafana-storage: