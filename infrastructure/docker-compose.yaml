services:
  sc:
    image: infinyon/fluvio:stable
    container_name: fluvio-sc
    hostname: sc
    networks:
      - fluvio-internal
    ports:
      - "9103:9003"
    environment:
      - RUST_LOG=info
    command: "./fluvio-run sc --local /fluvio/metadata"
    volumes:
      - fluvio-metadata:/fluvio/metadata
    healthcheck:
      test: ["CMD", "nc", "-z", "0.0.0.0", "9003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sc-setup:
    build:
      context: .
      dockerfile: Dockerfile.sc-setup
    container_name: fluvio-sc-setup
    networks:
      - fluvio-internal
    environment:
      - RUST_LOG=info
    depends_on:
      sc:
        condition: service_healthy

  spu:
    image: infinyon/fluvio:stable
    container_name: fluvio-spu
    hostname: spu
    networks:
      - fluvio-internal
    volumes:
      - fluvio-data:/fluvio/data
    environment:
      - RUST_LOG=info
    ports:
      - "9110:9010"
      - "9111:9011"
    command: "./fluvio-run spu -i 5001 -p spu:9010 -v spu:9011 --sc-addr sc:9004 --log-base-dir /fluvio/data"
    depends_on:
      sc-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "spu", "9010"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    networks:
      - influxdb-internal
    ports:
      - "8181:8181"
    environment:
      - RUST_LOG=info
      - INFLUXDB3_AUTH_TOKEN=market-making-auth-token-2024
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --auth-token=market-making-auth-token-2024
    volumes:
      - influxdb-data:/var/lib/influxdb3
      - influxdb-config:/etc/influxdb3

  influxdb-explorer:
    image: influxdata/influxdb3-ui:latest
    container_name: influxdb-explorer
    networks:
      - influxdb-internal
    ports:
      - "8888:80"
      - "8889:8888"
    volumes:
      - ./config:/app-root/config:ro
      - influxdb-explorer-db:/db:rw

  # "DEFAULT_INFLUX_SERVER": "http://influxdb:8181",
  # "DEFAULT_INFLUX_DATABASE": "market-data",
  # "DEFAULT_API_TOKEN": "market-making-auth-token-2024",
  # "DEFAULT_SERVER_NAME": "Market Making InfluxDB"
    environment:
      - DATABASE_URL=/db/sqlite.db
      - SESSION_SECRET_KEY=market-making-session-key-change-in-production-12345678901234567890123456789012
    command: --mode=admin
    depends_on:
      - influxdb



volumes:
  fluvio-metadata:
  fluvio-data:
  influxdb-data:
  influxdb-config:
  influxdb-explorer-db:
  influxdb-explorer-config:

networks:
  fluvio-internal:
    driver: bridge
    name: fluvio-network
  influxdb-internal:
    driver: bridge
    name: influxdb-network


