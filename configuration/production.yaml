# Production Configuration - Application Settings Only
# Infrastructure connections read from environment variables

# Production-optimized settings
trading:
  # Production symbol configurations - optimized for different use cases
  symbols:
    # Tier 1: Major trading pairs - full market data with maximum depth
    BTCUSDT:
      streams:
        orderbook:
          snapshot_limit: 5000 # Maximum depth for primary pair
          state_stream_depth: 100
          update_speed: "100ms"
        ticker:
        window:
          rolling_window_size: "1h"
        agg_trade:
      persist: true
      message_queue: true

    ETHUSDT:
      streams:
        orderbook:
          snapshot_limit: 1000 # High depth for ETH
          state_stream_depth: 50
          update_speed: "100ms"
        ticker: {}
        window:
          rolling_window_size: "1h"
        agg_trade: {}
      persist: true
      message_queue: true

    # Tier 2: Active altcoins - moderate depth, full streams
    SOLUSDT:
      streams:
        orderbook:
          snapshot_limit: 500
          state_stream_depth: 25
          update_speed: "1000ms"
        ticker: {}
        window:
          rolling_window_size: "4h"
        agg_trade: {}
      persist: true
      message_queue: true

    DOTUSDT:
      streams:
        orderbook:
          snapshot_limit: 500
          state_stream_depth: 25
          update_speed: "1000ms"
        ticker: {}
        agg_trade: {}
      persist: true
      message_queue: true

    # Tier 3: Monitoring pairs - essential data only
    ADAUSDT:
      streams:
        ticker: {}
        agg_trade: {}
      persist: true
      message_queue: false # No message queue overhead

    LINKUSDT:
      streams:
        ticker: {}
        window:
          rolling_window_size: "1d" # Daily trends only
      persist: false # Monitoring only, no persistence
      message_queue: false

  # Production defaults - conservative but comprehensive
  snapshot_limit: 1000
  state_stream_depth: 50
  startup_delay_seconds: 15 # Staggered startup to avoid rate limits

binance:
  use_testnet: false # Production Binance

logging:
  level: "warn" # Less verbose for production
