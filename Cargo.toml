[package]
name = "market_making"
version = "0.1.0"
edition = "2024"

[lib]
name = "marketmakerlib"
path = "src/lib.rs"


[[bin]]
name = "market-maker-bin"
path = "src/main.rs"

[[bin]]
name = "order-book-data-collector"
path = "src/order_book_data_collector.rs"

[dependencies]
anyhow = "1.0"
binance_spot_connector_rust = { version = "1.3.0", features = [
    "enable-hyper",
    "enable-tokio-tungstenite",
] }
#binance-sdk = { version = "1.0.0", features = ["spot", "websockets"] }
chrono = { version = "0.4", features = ["serde"] }
either = "1.15.0"
futures-util = "0.3.31"
rust_decimal = { version = "1.37", features = [
    "maths",
    "serde",
    "serde-with-str",
] }
rust_decimal_macros = "1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls", "native-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
surrealdb = { version = "2.3.5", features = [
    "allocator",
    "kv-mem",
    "kv-surrealkv",
    "kv-rocksdb",
] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
