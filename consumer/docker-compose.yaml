
services:
  consumer:
    build:
      context: ..
      dockerfile: Dockerfile.consumer
    container_name: market-making-consumer
    environment:
      - RUST_LOG=info
      - SYMBOL=BTCUSDT
    restart: unless-stopped
    network_mode: "host"

