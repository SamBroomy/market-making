# Base Application Configuration - Business Logic Only
# Infrastructure details (database, iggy) are read from environment variables

# Advanced Trading Configuration - Per-Symbol Stream Control
trading:
  # Symbol-specific configurations
  symbols:
    # Major pairs - full market data with high-resolution orderbook
    BTCUSDT:
      streams:
        orderbook:
          snapshot_limit: 999
          state_stream_depth: 50
          update_speed: "100ms"
        ticker:
        window:
          rolling_window_size: "1h"
        agg_trade:
      persist: true
      message_queue: true

    ETHUSDT:
      streams:
        orderbook:
          snapshot_limit: 999
          state_stream_depth: 50
          update_speed: "100ms"
        ticker:
        window:
          rolling_window_size: "1h"
        agg_trade:
      persist: true
      message_queue: true
    LINKUSDT:

  # Global defaults - applied when symbol configs don't specify values
  defaults:
    snapshot_limit: 100
    state_stream_depth: 25
    update_speed: "100ms"
    rolling_window_size: "1d"

# Binance API configuration
binance:
  use_testnet: true
  startup_delay_seconds: 5

# Logging configuration
logging:
  level: "warn"
