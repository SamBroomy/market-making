  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    networks:
      - iggy-network
      - timescale-network
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana



  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: market-making-producer
    networks:
      - iggy-network
      - timescale-network
    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      - RUST_LOG=warn
      - SYMBOLS=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOTUSDT,DOGEUSDT,MAGICUSDT,ETHBTC
    restart: unless-stopped

networks:
  iggy-network:
  timescale-network:

volumes:
  iggy:
  timescale-data:
  pgadmin-data:
  grafana-storage: